<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Compression progress: the "aha" moment as discovery of a new eigenvalue</title>
  <desc>Time axis shows flat description length that suddenly drops when a new pattern is discovered. A star marks the aha moment.</desc>

  <!-- axes -->
  <line x1="80" y1="320" x2="600" y2="320" stroke="#333" stroke-width="1.5"/>
  <line x1="80" y1="320" x2="80"  y2="40"  stroke="#333" stroke-width="1.5"/>

  <!-- labels -->
  <text x="340" y="360" text-anchor="middle" font-size="14" fill="#333">time / exposure</text>
  <text x="32" y="180" text-anchor="middle" font-size="14" fill="#333" transform="rotate(-90 32 180)">description length  K(data | model)</text>

  <!-- stepped curve: flat, flat, sudden drop (the aha), then lower flat -->
  <path d="M 80 160 L 240 160 L 240 155 L 340 155 L 340 80 L 500 80 L 500 75 L 600 75"
        fill="none" stroke="#1565c0" stroke-width="3"/>

  <!-- "aha" marker at the drop: golden star -->
  <g transform="translate(340, 120)">
    <polygon points="0,-18 5,-5 18,-5 7,3 12,16 0,8 -12,16 -7,3 -18,-5 -5,-5"
             fill="#ffc107" stroke="#e65100" stroke-width="1"/>
  </g>
  <text x="340" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">"aha!"</text>

  <!-- annotations -->
  <text x="160" y="140" text-anchor="middle" font-size="12" fill="#555" font-style="italic">old model struggles</text>
  <text x="160" y="188" text-anchor="middle" font-size="11" fill="#888">high K, low compressibility</text>

  <text x="340" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">new eigenvalue discovered</text>

  <text x="550" y="60" text-anchor="middle" font-size="12" fill="#555" font-style="italic">compressed</text>
  <text x="550" y="78" text-anchor="middle" font-size="11" fill="#888">low K, data is now "simple"</text>

  <!-- derivative below -->
  <line x1="340" y1="220" x2="340" y2="285" stroke="#e65100" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="340" y="305" text-anchor="middle" font-size="12" fill="#e65100" font-weight="bold">aesthetic pleasure ∝ − dK/dt</text>

  <!-- title -->
  <text x="320" y="25" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">
    Compression progress: beauty is the derivative of simplification
  </text>
</svg>
