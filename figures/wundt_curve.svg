<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>The Wundt curve: aesthetic value as an inverted-U in stimulus complexity</title>
  <desc>Aesthetic score rises with complexity, peaks, and falls, forming an inverted-U. The three zones are labeled Banal, Beautiful, and Chaotic.</desc>

  <!-- axes -->
  <line x1="80" y1="360" x2="600" y2="360" stroke="#333" stroke-width="1.5"/>
  <line x1="80" y1="360" x2="80"  y2="40"  stroke="#333" stroke-width="1.5"/>

  <!-- x axis ticks + labels -->
  <text x="340" y="400" text-anchor="middle" font-size="14" fill="#333">Stimulus complexity (relative to perceiver's model)</text>
  <text x="80"  y="380" text-anchor="middle" font-size="12" fill="#666">low</text>
  <text x="600" y="380" text-anchor="middle" font-size="12" fill="#666">high</text>

  <!-- y axis label (rotated) -->
  <text x="32" y="200" text-anchor="middle" font-size="14" fill="#333" transform="rotate(-90 32 200)">Aesthetic score</text>

  <!-- inverted-U: a nice concave-down polynomial from (80, 360) peak (340, 60) back to (600, 360) -->
  <path d="M 80 360 Q 210 -80, 340 60 Q 470 -80, 600 360" fill="none" stroke="#1565c0" stroke-width="3"/>

  <!-- peak dot -->
  <circle cx="340" cy="60" r="6" fill="#e65100"/>
  <text x="340" y="45" text-anchor="middle" font-size="13" fill="#e65100" font-weight="bold">optimum</text>

  <!-- zone dividers (dashed) -->
  <line x1="220" y1="50"  x2="220" y2="360" stroke="#aaa" stroke-dasharray="4 4"/>
  <line x1="460" y1="50"  x2="460" y2="360" stroke="#aaa" stroke-dasharray="4 4"/>

  <!-- zone labels -->
  <text x="150" y="100" text-anchor="middle" font-size="13" fill="#666" font-style="italic">banal</text>
  <text x="150" y="118" text-anchor="middle" font-size="11" fill="#888">(high compressibility,</text>
  <text x="150" y="132" text-anchor="middle" font-size="11" fill="#888">no information)</text>

  <text x="340" y="100" text-anchor="middle" font-size="13" fill="#2e7d32" font-weight="bold">beautiful</text>
  <text x="340" y="118" text-anchor="middle" font-size="11" fill="#888">(symmetry + controlled</text>
  <text x="340" y="132" text-anchor="middle" font-size="11" fill="#888">violation)</text>

  <text x="530" y="100" text-anchor="middle" font-size="13" fill="#666" font-style="italic">chaotic</text>
  <text x="530" y="118" text-anchor="middle" font-size="11" fill="#888">(incompressible,</text>
  <text x="530" y="132" text-anchor="middle" font-size="11" fill="#888">pure noise)</text>

  <!-- caption strip -->
  <text x="320" y="225" text-anchor="middle" font-size="11" fill="#555" font-style="italic">
    Wundt 1874; Berlyne 1971; Berlyne's Law = tangency condition on the eigenspectrum
  </text>
</svg>
